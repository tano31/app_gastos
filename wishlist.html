<body>

      <nav class="sidebar-nav">

        <a href="dashboard.html">

        <a href="inversiones.html"><i class="fa-solid fa-chart-line"></i><span data-i18n="invest.name">Inversiones</span></a>

        <a href="nubank.html">
          <img src="img/logo_nubank.png" alt="Nubank" class="sidebar-icon">

        <a href="c6.html">
          <img src="img/logo_c6.png" alt="C6 Bank" class="sidebar-icon">
        </a>

          <span data-i18n="market.name">Mercado</span>

        <a href="configuracion.html">

      </nav>

    </div>

    <div class="sidebar-footer">
    <button id="logoutBtn" class="logout-btn" type="button">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span data-i18n="nav.logout">Salir</span>
    </button>
      <p class="app-version" data-i18n="nav.version">Versión 1.1</p>
    </div>

  <div class="main-content">
    <header class="app-header">
      <div>
        <h1 class="page-section-title"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i><span id="wishlistTitle">Wishlist</span></h1>
        <p id="wishlistIntro">Compartí las mejoras que te gustaría sumar a la plataforma.</p>
      </div>
    </header>
    <main class="container wishlist-container">
      <section class="panel"><h2 id="wishNewTitle">Enviar una propuesta</h2>
        <form id="wishForm" class="wishlist-compose">
          <label id="wishLabel" for="wishText">¿Qué te gustaría mejorar?</label>
          <textarea id="wishText" maxlength="20000" aria-describedby="wishCount" required></textarea>
          <div class="wishlist-compose-footer"><span id="wishCount" class="wishlist-count">0 / 250 palabras</span><button id="sendWish" type="submit" disabled>Enviar</button></div>
        </form>
      </section>
      <section class="panel"><div class="table-header"><h2 id="wishListTitle">Propuestas</h2><button id="refreshWishlist" type="button" class="btn-secondary">Actualizar lista</button></div><p id="wishStatus" class="wishlist-message" role="status" aria-live="polite"></p><div id="wishList" class="wishlist-list"></div></section>
    </main>
  </div>
